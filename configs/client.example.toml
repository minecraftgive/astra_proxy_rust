# 尚未暴露的 TOML 配置：入站账号、自动故障切换、全局 UDP 开关、
# ALPN、TLS insecure/skip_verify、HY2 带宽/端口跳跃、mux 池大小/填充等未向本版 TOML 暴露。
# 不要将其他项目同名字段直接复制到这里，未知字段会被拒绝。
# XHTTP packet-up 无独立上传 EOF；Xray 空包/大包与半关闭边界见兼容性说明。

# ---------- VLESS Encryption + Vision + XHTTP auto ----------
# 此节点同时演示 encryption、flow、客户端 TLS 指纹、服务端证书 pin 和 XHTTP auto。
# encryption 原字符串放在 [outbounds.config]，不要填入 TLS/REALITY 公钥或证书指纹字段。
# Vision 叠加 HTTP 传输时必须启用 native/xorpub VLESS Encryption。
# Vision DIRECT 在 Encryption 记录层与其下方 HTTP 隧道之间切换，不绕过 HTTP/TLS。
[[outbounds]]
kind = "native"
tag = "vless-encryption-vision-xhttp-auto"
[outbounds.config]
protocol = "vless"
server = "node.example.com"
port = 443
uuid = "00000000-0000-0000-0000-000000000001"
flow = "xtls-rprx-vision"
encryption = "mlkem768x25519plus.native.0rtt.AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA" # 示例公钥，需替换
[outbounds.config.tls]
server_name = "node.example.com"
fingerprint = "chrome"
cert_pin_sha256 = "1111111111111111111111111111111111111111111111111111111111111111" # 需替换
[outbounds.config.transport]
kind = "xhttp"
path = "/your-path"
mode = "auto"

# ---------- Rule Core 完整模板（注释附录，不是 Proxy Core 字段） ----------
# 使用规则模式：将以下 BEGIN/END 之间每行最前面的 "# " 去掉，另存为 rule.toml。
# 把上方 standalone 改为 false，删除 standalone_outbound，启动 astra-rule rule.toml。
# rule_socket 与 rule.toml 的 socket 保持一致；也可直接由 astra-tui 管理配置。
# BEGIN RULE CONFIG
# # Astra 0.1.0：全部规则设置与匹配类型示例。
# # 配套 example_proxy.toml；两端 UDS 路径必须一致。
# # 校验：target/release/astra-rule --check example_rule.toml
# # 规则按本文件出现顺序，第一条匹配生效；不是按“精确 > 后缀 > CIDR”等固定优先级。
# # 不支持 include 或 MRS；支持 MMDB、GeoIP .dat 与命名规则集；支持配置热切换/热重载。
# # ---------- 全部顶层设置 ----------
# watch_config = false # 默认 false；true：每秒监测当前文件内容，支持原子替换，编译成功后热应用
# # 失败保留旧规则；同一份无效内容不重复刷日志，修正内容后重试。也可 SIGHUP/TUI/管理 IPC 重载。
# # 这是本规则核心独立的开关，与 example_proxy.toml.watch_config 分别生效。
# socket = "/tmp/astra-rule.sock"
# # 显式规则未命中时，本地 IP 段默认直连，再使用 default_action。设为 false 可关闭。
# direct_local = true
# geoip_database = "geoip/Country.mmdb"
# geoip_url = "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
# geoip_interval = 86400
# # telegram 等分类可使用 geoip/geoip.dat，下载地址改为
# # https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
# geosite_database = "geosite/geosite.dat"
# geosite_url = "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
# geosite_interval = 86400
# # 全部 action：direct / block / proxy:TAG；区分大小写。
# # TAG 为 example_proxy.toml 中唯一出站标签。默认使用 VLESS TLS 占位节点，运行前替换节点值。
# default_action = "proxy:vless-tls"
# # default_action = "direct" # 选择直连默认策略时替换上一行，不能同时重复定义
# # default_action = "block"  # 未匹配请求全部拒绝
#
# # ---------- domain_exact：域名精确匹配 ----------
# [[rules]]
# kind = "domain_exact"
# value = "blocked.example"
# action = "block"
#
# # 精确规则放在更宽的后缀前，以便覆盖。
# [[rules]]
# kind = "domain_exact"
# value = "direct.example.com"
# action = "direct"
#
# # ---------- domain_suffix：按标签边界匹配域名及其子域 ----------
# # example.com 与 a.example.com 命中；notexample.com 不命中。
# # 域名会规范化大小写；国际化域名建议填写 ASCII/Punycode。
# [[rules]]
# kind = "domain_suffix"
# value = "example.com"
# action = "proxy:vless-tls-xhttp-stream-one"
#
# # ---------- ip_cidr：IPv4 / IPv6 ----------
# # 只对客户端明确发送的 IP 目标匹配；不会主动解析域名来匹配 CIDR。
# [[rules]]
# kind = "ip_cidr"
# value = "127.0.0.0/8"
# action = "direct"
#
# [[rules]]
# kind = "ip_cidr"
# value = "::1/128"
# action = "direct"
#
# [[rules]]
# kind = "ip_cidr"
# value = "192.168.0.0/16"
# action = "direct"
#
# [[rules]]
# kind = "ip_cidr"
# value = "fc00::/7"
# action = "direct"
#
# # ---------- process_name / process_path：本地发起进程 ----------
# # Windows/Linux 查询本机连接归属；远程客户端或无权限时进程未知，不匹配进程规则。
# # 进程名不区分大小写；Windows 路径统一斜杠及大小写，Unix 路径区分大小写。
# # 与其他类别按文件顺序匹配；不从 HTTP 请求头或客户端声明推断进程。
# # [[rules]]
# # kind = "process_name"
# # value = "browser.exe"
# # action = "proxy:vless-tls"
# # [[rules]]
# # kind = "process_path"
# # value = 'C:\Program Files\Browser\browser.exe'
# # action = "direct"
#
# # ---------- port：单个端口，以字符串填写，范围 1..65535 ----------
# # 不接受 "80,443" 或 "1000-2000"；多个端口分别写规则。
# # 端口规则不区分 TCP/UDP；本版没有单条规则的多条件 AND。
# [[rules]]
# kind = "port"
# value = "25"
# action = "block"
#
# [[rules]]
# kind = "port"
# value = "8443"
# action = "proxy:trojan-tls"
#
# # ---------- network：udp / tcp ----------
# # UDP 目标可交由 TUIC；此前域名/IP/端口规则若命中，仍优先生效。
# [[rules]]
# kind = "network"
# value = "udp"
# action = "proxy:tuic-native-cubic"
#
# # 此处 TCP 兜底；因为 network 只有 tcp/udp，上述 UDP + 此条 TCP 覆盖所有请求，
# # 因此当前 default_action 不会被走到。要实际使用 default_action，删除此条 TCP 兜底，
# # 或按需要也删除 UDP 兜底。
# [[rules]]
# kind = "network"
# value = "tcp"
# action = "proxy:vless-tls"
#
# # 其他出站只需将任一 action 的 TAG 替换成 example_proxy.toml 对应标签，例如：
# # proxy:socks5-auth / proxy:http-auth / proxy:ss-aes-256-gcm
# # proxy:vmess-chacha20-poly1305 / proxy:hysteria2-salamander / proxy:tuic-quic-bbr
# # proxy:vless-vision-reality / proxy:vless-mux-h2mux
# # action 不能直接写协议名；不存在的 TAG 会导致连接失败，不会静默直连。
# # ---------- 修改规则、切换文件和缓存行为 ----------
# # 不需重启：watch_config=true 自动应用；也可 kill -HUP <Rule-Core-PID> 重读当前文件。
# # TUI Ctrl-S 保存/c 切换文件时热应用；R 手动重载，r 仍为完整重启。
# # 独立管理 socket 示例（与 Proxy Core 的管理 socket、上方路由 socket 均不同）：
# # ASTRA_CONTROL_SOCKET=/tmp/astra-rule-control.sock ./target/release/astra-rule example_rule.toml
# # ./target/release/astra-rule --reload /tmp/astra-rule-control.sock
# # ./target/release/astra-rule --switch /tmp/astra-rule-control.sock /absolute/path/to/other-rule.toml
# # --switch 成功后记住新配置路径；之后的 SIGHUP 和文件监测读新文件。
# # socket 也可热切换：先绑定新路径，再提交；旧路径不可用，新建代理 IPC 需同步更新 rule_socket。
# # 新配置会先编译索引、准备 socket，语法错误/动作无效/路径占用等均拒绝候选并保留旧规则。
# # 既有持久 IPC 连接在后续路由请求时读取新规则，不需为了规则更新断开连接。
# # 规则版本通过独立订阅通道推送给代理，决策缓存按版本隔离；不是固定等待默认 5 秒 TTL。
# # 推送有短暂异步传播延迟；规则服务断连后不继续使用旧版本缓存，已有 TCP/UDP 数据流保持原出口。
# # Proxy Core standalone=true 时完全不访问本规则核心，也无需启动本规则核心或提供此文件。
# # TUN/TPROXY/REDIRECT 目标通常是 IP，域名规则不会自动解析/嗅探 IP 还原域名；可按 IP/端口/network 路由。
# # 规则动作仅支持 direct/block/proxy:TAG；没有 mode/tun/system_proxy 等字段，它们放在代理配置中。
# # 启动记录级别可用 ASTRA_LOG_LEVEL=info；也可在 TUI 日志页 L 动态修改，不是本文件的 TOML 字段。
# # 更多模式、权限、设备重建限制和验收边界见 docs/PROXY_MODES.md；新旧 IPC 版本不可混用。
#
# # GeoIP: 已预设 MMDB 来源；首次使用国家规则时下载到 geoip/Country.mmdb。
# # [[rules]]
# # kind = "geoip"
# # value = "CN"
# # action = "direct"
# # [[rules]]
# # kind = "rule_set"
# # value = "ads"
# # action = "block"
# # [rule_sets.ads]
# # behavior = "domain"
# # format = "yaml"
# # payload = ["+.ads.example"]
# # 文件模式: 删除 payload，设置 path = "rules/ads.yaml"。
# # HTTP 模式: 再设置 url = "https://example.com/ads.yaml" 和 interval = 86400。
#
# # [[rules]]
# # kind = "geosite"
# # value = "google@cn"
# # action = "direct"
# END RULE CONFIG

# 代理组（取消注释后，将成员改为本文件定义的节点标签）
# [proxy_groups.main]
# mode = "select" # select 手动选择；auto 自动测速
# members = ["edge"]
# selected = "edge" # 手动模式的当前成员；默认使用第一项
# url = "https://www.gstatic.com/generate_204" # auto 使用
# interval = 300
# timeout_ms = 5000
# tolerance_ms = 50
# 规则动作可用 proxy:main；独立模式可将 standalone_outbound 设为 main。

# 各代理组可选的切换断连策略，均默认 false（写在对应 [proxy_groups.名称] 下）
# disconnect_on_manual = false        # 手动选择改变
# disconnect_on_auto = false          # 原节点健康，切换到更优节点
# disconnect_on_failure = false       # 当前节点失效或全部不可用
# disconnect_on_recovery = false      # 从全部不可用恢复
# disconnect_on_config_change = false # 成员/顺序/模式改变或组被移除

# 默认代理组：自动纳入本配置内的所有节点。
[proxy_groups.PROXY]
mode = "select"
include_all = true
# selected = "edge" # 可选；默认使用展开后的第一项
# filter = "香港|日本" # 仅筛选动态纳入的节点名称（正则）
# exclude_filter = "到期|测试"
# include_all_groups = false # 动态纳入其他组；仍需通过循环检查


# Clash/Mihomo 节点订阅（使用 astra-convert URL 自动生成管理范围）。
# [subscription]
# url = "https://example.com/clash"
# interval = 3600
# user_agent = "clash.meta/astra"
# import_groups = false
# 核心自动维护下载节点缓存；已有手动节点保留。

# 多订阅可替代上面的单订阅段；每个名称对应一个独立更新来源。
# [subscriptions.primary]
# url = "https://example.com/clash"
# interval = 3600
# [subscriptions.backup]
# url = "https://example.net/clash"
# interval = 7200

# DNS / Fake IP (optional; UDP and TCP listeners share the listed addresses)
# [dns]
# enable = true
# listen = ["127.0.0.1:1053"]
# nameserver = ["https://1.1.1.1/dns-query", "tls://1.0.0.1:853"]
# fallback = ["udp://8.8.8.8:53"]
# bootstrap = ["1.1.1.1", "8.8.8.8"]
# respect_rules = false
# hijack = true
# fake_ip = true
# fake_ip_range = "198.18.0.0/16"
# fake_ip_filter = ["+.lan", "+.local", "localhost"]
# cache_capacity = 4096
# max_concurrent = 128
# mapping_capacity = 8192
# See docs/DNS.md for IPv6, TTL, nameserver_policy and subscription imports.

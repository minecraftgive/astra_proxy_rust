# Standalone DNS service; no Rule Core or proxy inbound required.
# Point a test DNS client at 127.0.0.1:1053 (UDP or TCP).
auto_start = false
[dns]
enable = true
listen = ["127.0.0.1:1053"]
nameserver = ["https://1.1.1.1/dns-query", "tls://1.0.0.1:853"]
fallback = ["tls://8.8.8.8:853"]
# Proxy endpoint and upstream hostname resolution; these servers always use DIRECT.
# At least one IP-literal server is required when this list is nonempty.
proxy_server_nameserver = ["https://1.1.1.1/dns-query", "tls://1.0.0.1:853"]
# Encrypted-only by default; set true to allow udp:// / tcp:// upstreams (insecure).
plaintext_bypass = false
bootstrap = ["1.1.1.1", "8.8.8.8"]
respect_rules = false
fake_ip = false
cache_capacity = 4096
query_timeout_ms = 3000
max_concurrent = 128

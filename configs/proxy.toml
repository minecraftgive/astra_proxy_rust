# Default to loopback. Do NOT bind publicly without an auth/firewall layer.
rule_socket = "/tmp/astra-rule.sock"
socks5_listen = "127.0.0.1:1080"
http_listen = "127.0.0.1:8080"
ipc_connections = 8
decision_timeout_ms = 500
connect_timeout_secs = 8
max_connections = 4096
decision_cache_ttl_secs = 5

[proxy_groups.PROXY]
mode = "select"
include_all = true

# Example upstream SOCKS5. Set rules to "proxy:edge" to route through it.
# [[outbounds]]
# kind = "socks5"
# tag = "edge"
# server = "127.0.0.1:7890"


socket = "/tmp/astra-rule.sock"
default_action = "direct"

# First matching rule wins, even across different rule categories.
[[rules]]
kind = "domain_suffix"
value = "ads.example"
action = "block"

[[rules]]
kind = "domain_exact"
value = "blocked.test"
action = "block"


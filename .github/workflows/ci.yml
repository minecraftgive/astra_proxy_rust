name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/test.py tools architecture
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev nasm pkg-config
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: python scripts/build.py --role client --profile debug --non-interactive
      - run: python scripts/build.py --role server --profile debug --non-interactive
      - name: Allow ICMP echo sockets for the test runner group
        run: sudo sysctl -w net.ipv4.ping_group_range="$(id -g) $(id -g)"
      - run: python scripts/test.py unit --debug
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        # Both macOS architectures run this check in macos-acceptance below.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev nasm pkg-config
      - if: runner.os == 'Windows'
        run: choco install nasm llvm --no-progress -y
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:/Program Files/NASM" >> "$GITHUB_PATH"
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - run: python scripts/test.py check --debug
      - name: Verify TUI Connect and Logs with a constrained Windows stack
        if: runner.os == 'Windows'
        shell: python {0}
        run: |
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from astra_tools.workspace import build_environment
          subprocess.run([
              'cargo', 'test', '-p', 'astra-tui', '--lib', '--locked',
              '--target', 'x86_64-pc-windows-msvc',
              'ui::stack_tests::connect_and_logs_fit_background_stack_budget',
              '--', '--exact',
          ], env=build_environment(), check=True)
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  management:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev nasm pkg-config openssl
      - run: cargo run --locked -p astra-management --bin export-contracts -- --check
      - run: python scripts/build.py --role all --profile debug --package --non-interactive
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: apps/web
      - name: Verify and boot the exact four role archives
        run: |
          artifact_dir=$(python -c "import sys; sys.path.insert(0,'scripts'); from astra_tools.artifacts import discover_index; print(discover_index().directory)")
          python scripts/test.py package management --debug --artifact-dir "$artifact_dir" --browser --report .test-tools/management-ci.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: management-verification
          path: |
            .test-tools/*.json
            /tmp/astra-management-*/browser/**/*.png
          if-no-files-found: ignore
          include-hidden-files: true
  macos-acceptance:
    name: macOS acceptance (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '1'
      CARGO_TARGET_DIR: /tmp/astra-target
      EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/cache@v5
        with:
          # Download caches are optional; no local target directory, browser,
          # certificate or reference-server installation is assumed.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ matrix.runner }}-
      - name: Install native dependencies and set short private temporary paths
        run: |
          brew install cmake ninja nasm llvm pkg-config openssl@3
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          short_tmp=$(mktemp -d /tmp/ac.XXXXXX)
          chmod 700 "$short_tmp"
          echo "TMPDIR=$short_tmp" >> "$GITHUB_ENV"
          mkdir -p .test-tools
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from astra_tools.workspace import host_target
          target = host_target(dict(os.environ))
          assert target == os.environ['EXPECTED_TARGET'], (target, os.environ['EXPECTED_TARGET'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CARGO_BUILD_TARGET={target}\n')
          print(f'Native runner target: {target}')
          PY
      - name: Build and package all four roles from the clean checkout
        id: build
        run: python scripts/build.py --role all --profile debug --package --non-interactive 2>&1 | tee .test-tools/macos-build.log
      - name: Resolve the exact package index and stage short-path test executables
        id: prepare
        run: |
          python - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from astra_tools.artifacts import ROLES, discover_index
          from astra_tools.platform import executable
          index = discover_index()
          assert set(dict(index.archives(profile='debug'))) == set(ROLES)
          sources = {Path(entry['binary_dir']) for entry in index.select(profile='debug')}
          assert len(sources) == 1
          source = sources.pop()
          # The real update regression creates sockets beside the selected bin
          # directory. A real short directory avoids macOS sun_path limits;
          # symlinks would be canonicalized back to the long build directory.
          binaries = Path('/tmp/astra-bin')
          binaries.mkdir(mode=0o700)
          for name in {name for role in ROLES.values() for name in role.binaries}:
              shutil.copy2(source / executable(name), binaries / executable(name))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'ASTRA_CI_ARTIFACT_DIR={index.directory}\n')
              output.write(f'ASTRA_CI_BIN_DIR={binaries}\n')
          print(f'Exact artifact index: {index.directory / "artifacts.json"}')
          PY
      - name: Install the pinned Playwright Chromium browser
        id: browser
        working-directory: apps/web
        run: npx --no-install playwright install chromium
      - name: Check the generated contract and frontend tests
        run: |
          cargo run --locked -p astra-management --bin export-contracts -- --check
          npm --prefix apps/web test
      - name: Check all targets and run workspace, live TUI, client and server regressions
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python scripts/test.py check unit live client server --debug --bin-dir "$ASTRA_CI_BIN_DIR" --keep-going --report .test-tools/macos-core.json 2>&1 | tee .test-tools/macos-core.log
      - name: Verify extracted packages and the real browser management deployment
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: python scripts/test.py package management --debug --artifact-dir "$ASTRA_CI_ARTIFACT_DIR" --browser --keep-going --report .test-tools/macos-management.json 2>&1 | tee .test-tools/macos-management.log
      - name: Upload reports, manifests and browser screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macos-acceptance-${{ matrix.arch }}
          retention-days: 14
          include-hidden-files: true
          # Select only evidence. Deployment directories contain ephemeral
          # credentials; Playwright traces can include authenticated requests.
          path: |
            .test-tools/macos-*.json
            .test-tools/macos-*.log
            .test-tools/management-scenario.json
            .test-tools/*.verification.json
            dist/*/artifacts.json
            dist/*/debug/*/manifest.json
            /tmp/astra-management-*/report.json
            /tmp/astra-management-*/browser/**/*.png
            /tmp/astra-management-*/browser/runner.log
          if-no-files-found: warn

[workspace]
members = ["crates/astra-observe", "crates/astra-model", "crates/astra-platform", "crates/astra-resource", "crates/astra-management", "crates/astra-manager", "crates/astra-web", "crates/astra-tui-kit", "crates/astra-app", "crates/astra-update", "crates/astra-dns", "crates/astra-rule-data", "crates/astra-protocols", "crates/astra-ipc", "crates/astra-rule", "crates/astra-proxy", "crates/astra-tui", "crates/astra-convert", "crates/astra-server-core"]
resolver = "2"
exclude = ["vendor/meow-proxy", "vendor/netstack-smoltcp", "vendor/meow-common"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[patch.crates-io]
meow-common = { path = "vendor/meow-common" }
meow-proxy = { path = "vendor/meow-proxy" }
netstack-smoltcp = { path = "vendor/netstack-smoltcp" }

# Fast local iteration, retaining file/line information in panic backtraces.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
lto = "off"
codegen-units = 256
incremental = true
panic = "unwind"

# Release semantics with compilation speed taking priority over runtime speed.
# Keep the standard `release` profile unchanged for ordinary cargo --release.
[profile.release-fast]
inherits = "release"
opt-level = 0
debug = 0
lto = "off"
codegen-units = 256
incremental = true
panic = "unwind"

# Optimized debug builds retain dev assertions, overflow checks and line info.
[profile.dev-runtime]
inherits = "dev"
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
panic = "unwind"

[profile.release-runtime]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
panic = "unwind"

[workspace]
members = ["crates/astra-observe", "crates/astra-model", "crates/astra-platform", "crates/astra-resource", "crates/astra-management", "crates/astra-manager", "crates/astra-web", "crates/astra-tui-kit", "crates/astra-app", "crates/astra-update", "crates/astra-dns", "crates/astra-rule-data", "crates/astra-protocols", "crates/astra-ipc", "crates/astra-rule", "crates/astra-proxy", "crates/astra-tui", "crates/astra-convert", "crates/astra-server-core"]
resolver = "2"
exclude = ["vendor/meow-proxy", "vendor/netstack-smoltcp", "vendor/meow-common"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[patch.crates-io]
meow-common = { path = "vendor/meow-common" }
meow-proxy = { path = "vendor/meow-proxy" }
netstack-smoltcp = { path = "vendor/netstack-smoltcp" }

# Exactly two build profiles are supported: `dev` and `release`.
# Do not add custom [profile.*] sections; the built-in `test` and `bench`
# profiles inherit from `dev` and `release` respectively.

# dev: minimum compile time. No optimization, no debug info, maximal codegen
# parallelism and incremental reuse. Assertions and overflow checks stay on.
[profile.dev]
opt-level = 0
debug = false
debug-assertions = true
overflow-checks = true
lto = "off"
codegen-units = 256
incremental = true
panic = "unwind"

[profile.dev.build-override]
opt-level = 0
debug = false
codegen-units = 256

# release: maximum runtime performance. Whole-program fat LTO with a single
# codegen unit. `panic = "unwind"` is kept because astra-manager relies on
# catch_unwind and tokio isolates task panics. No target-cpu=native, so
# binaries stay portable to any CPU of the target architecture.
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
incremental = false
panic = "unwind"

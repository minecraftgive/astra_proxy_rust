[workspace]
members = ["crates/astra-protocols", "crates/astra-ipc", "crates/astra-rule", "crates/astra-proxy", "crates/astra-tui", "crates/astra-convert", "crates/astra-server-api", "crates/astra-server-core", "crates/astra-server-tui"]
resolver = "2"
exclude = ["vendor/meow-proxy"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[patch.crates-io]
meow-proxy = { path = "vendor/meow-proxy" }

[package]
name = "astra-management"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
bindings = ["dep:ts-rs", "astra-model/bindings", "astra-platform/bindings"]

[[bin]]
name = "export-contracts"
path = "src/bin/export-contracts.rs"
required-features = ["bindings"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }
toml.workspace = true
astra-ipc = { path = "../astra-ipc" }
astra-model = { path = "../astra-model" }
astra-platform = { path = "../astra-platform" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

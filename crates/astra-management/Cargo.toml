[package]
name = "astra-management"
version = "0.1.0"
edition.workspace = true
license.workspace = true
[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
ts-rs = { version = "12", features = ["serde-json-impl"] }
toml.workspace = true
astra-ipc = { path = "../astra-ipc" }
astra-model = { path = "../astra-model", features = ["bindings"] }
astra-platform = { path = "../astra-platform", features = ["bindings"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package]
name = "astra-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "astra-tui"

[[bin]]
name = "astra-tui"
path = "src/main.rs"

[[bin]]
name = "astra-server-tui"
path = "src/server_main.rs"

[dependencies]
astra-platform = { path = "../astra-platform" }
astra-app = { path = "../astra-app" }
astra-model = { path = "../astra-model" }
astra-tui-kit = { path = "../astra-tui-kit" }
anyhow.workspace = true
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio.workspace = true
serde.workspace = true
toml.workspace = true
astra-ipc = { path = "../astra-ipc" }
astra-management = { path = "../astra-management" }
astra-update = { path = "../astra-update" }
astra-convert = { path = "../astra-convert" }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info", "unstable-backend-writer"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde_json = "1"
toml_edit = "0.23"
sha2 = "0.10"

[dev-dependencies]
astra-manager = { path = "../astra-manager" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


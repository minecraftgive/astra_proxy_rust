[package]
name = "astra-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio.workspace = true
serde.workspace = true
toml.workspace = true
astra-ipc = { path = "../astra-ipc" }
astra-convert = { path = "../astra-convert" }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
serde_json = "1"
toml_edit = "0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


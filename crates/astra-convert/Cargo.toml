[package]
name = "astra-convert"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
astra-dns = { path = "../astra-dns" }
astra-ipc = { path = "../astra-ipc" }
astra-rule-data = { path = "../astra-rule-data" }
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
serde_yaml = "0.9"
yaml-rust2 = { version = "0.13", default-features = false }
ipnet = "2"
uuid = "1"

ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
regex = "1"
percent-encoding = "2"

base64 = "0.22"
serde_json = "1"

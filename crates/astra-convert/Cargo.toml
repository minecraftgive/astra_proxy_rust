[package]
name = "astra-convert"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["download"]
download = ["dep:ureq"]

[dependencies]
astra-model = { path = "../astra-model" }
anyhow.workspace = true
tracing.workspace = true
flate2 = "1"
serde.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
serde_yaml = "0.9"
yaml-rust2 = { version = "0.13", default-features = false }
ipnet = "2"
uuid = "1"

ureq = { optional = true, version = "2.12", default-features = false, features = ["tls"] }
url = "2"
regex = "1"
percent-encoding = "2"

base64 = "0.22"
serde_json = "1"

[[test]]
name = "conversion"
path = "src/test/conversion_test.rs"

[[test]]
name = "dns"
path = "src/test/dns_test.rs"

[[test]]
name = "download"
path = "src/test/download_test.rs"

[[test]]
name = "share"
path = "src/test/share_test.rs"

[[test]]
name = "share_export"
path = "src/test/share_export_test.rs"

[[test]]
name = "subscription"
path = "src/test/subscription_test.rs"

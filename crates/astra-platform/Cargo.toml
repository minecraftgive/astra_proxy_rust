[package]
name = "astra-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
bindings = ["dep:ts-rs"]

[dependencies]
ts-rs = { version = "12", optional = true }
chrono = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
astra-model = { path = "../astra-model" }
tokio.workspace = true
serde.workspace = true
serde_json = "1"
bincode.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Com"] }

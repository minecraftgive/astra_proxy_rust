[package]
name = "astra-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
astra-protocols = { path = "../astra-protocols" }
astra-ipc = { path = "../astra-ipc" }
astra-convert = { path = "../astra-convert" }
tokio.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
moka = { version = "0.12", features = ["sync"] }
tokio-rustls = "0.26"
uuid = { version = "1", features = ["v4"] }
meow-common = "=0.23.1"
bytes = "1"
http = "1"

arc-swap = "1.9.3"
futures-util = "0.3.34"
libc = "0.2.191"
socket2 = "0.6.5"
netstack-smoltcp = "0.2.4"
tun-rs = { version = "2.8.13", features = ["async"] }
etherparse = "0.16"

ipnet = "2"
webpki-roots = "1"
serde_json = "1"
url = "2"
toml_edit = "0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Networking_WinInet"] }

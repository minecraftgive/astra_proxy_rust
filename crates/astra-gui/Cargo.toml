[package]
name = "astra-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "astra-gui"

[[bin]]
name = "astra-gui"
path = "src/main.rs"

[[bin]]
name = "astra-server-gui"
path = "src/server_main.rs"

[features]
test-support = []

[dependencies]
astra-client = { path = "../astra-client" }
astra-app = { path = "../astra-app" }
astra-model = { path = "../astra-model" }
astra-management = { path = "../astra-management" }
astra-ipc = { path = "../astra-ipc" }
astra-platform = { path = "../astra-platform" }
gpui-component = { version = "=0.9.0", default-features = false }
# Component 0.9.0 does not re-export GPUI; use its exact underlying package,
# so there is a single GPUI version and no crates.io gpui 0.2 dependency.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["runtime_shaders", "font-kit", "wayland", "x11"] }
async-channel = "2"
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json = "1"
zeroize = "=1.9.1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry"] }

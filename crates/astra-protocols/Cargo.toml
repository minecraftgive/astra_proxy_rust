[package]
name = "astra-protocols"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
astra-ipc = { path = "../astra-ipc" }
tokio.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tokio-rustls = "0.26"
webpki-roots = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
meow-proxy = { version = "=0.23.1", default-features = false, features = ["ss", "trojan", "vless", "vless-vision", "vless-encryption", "vmess", "hysteria2", "mux", "vless-server"] }
meow-common = "=0.23.1"
meow-transport = { version = "=0.23.1", features = ["reality", "xhttp", "grpc", "httpupgrade", "h2"] }
rustls-pemfile = "2"
async-trait = "0.1"
bytes = "1"
http = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }

h2 = "0.4"
futures-util = "0.3.34"


subtle = "2"
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher", "aead-cipher-2022", "security-replay-attack-detect"] }
quiche = "0.30"

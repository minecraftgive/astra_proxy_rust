# 尚未暴露的 TOML 配置：入站账号、DNS/Fake-IP、自动故障切换、全局 UDP 开关、
# ALPN、TLS insecure/skip_verify、HY2 带宽/端口跳跃、mux 池大小/填充等未向本版 TOML 暴露。
# 不要将其他项目同名字段直接复制到这里，未知字段会被拒绝。
# XHTTP packet-up 无独立上传 EOF；Xray 空包/大包与半关闭边界见兼容性说明。

# ---------- VLESS Encryption + Vision + XHTTP auto ----------
# 此节点同时演示 encryption、flow、客户端 TLS 指纹、服务端证书 pin 和 XHTTP auto。
# encryption 原字符串放在 [outbounds.config]，不要填入 TLS/REALITY 公钥或证书指纹字段。
# Vision 叠加 HTTP 传输时必须启用 native/xorpub VLESS Encryption。
# Vision DIRECT 在 Encryption 记录层与其下方 HTTP 隧道之间切换，不绕过 HTTP/TLS。
[[outbounds]]
kind = "native"
tag = "vless-encryption-vision-xhttp-auto"
[outbounds.config]
protocol = "vless"
server = "node.example.com"
port = 443
uuid = "00000000-0000-0000-0000-000000000001"
flow = "xtls-rprx-vision"
encryption = "mlkem768x25519plus.native.0rtt.AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA" # 示例公钥，需替换
[outbounds.config.tls]
server_name = "node.example.com"
fingerprint = "chrome"
cert_pin_sha256 = "1111111111111111111111111111111111111111111111111111111111111111" # 需替换
[outbounds.config.transport]
kind = "xhttp"
path = "/your-path"
mode = "auto"

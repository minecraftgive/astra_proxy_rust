# Astra 0.1.0：全部代理配置字段与协议变体示例。
# 放置位置：项目根目录；配套 example_rule.toml。
# 校验：python3 scripts/astra.py --bin-dir target/release --check --proxy example_proxy.toml --rules example_rule.toml
# 运行：python3 scripts/astra.py --bin-dir target/release --proxy example_proxy.toml --rules example_rule.toml
# 所有服务器、UUID、密码、公钥和 pin 都是占位数据，使用前替换。
# 配置检查不会连接服务器；通过检查不代表每个组合已有互通验证。
# 已实测组合与服务端边界见 docs/COMPATIBILITY.md。
# 本文件同时注册多个出站；规则模式按 tag 选用，独立模式用 standalone_outbound 固定选择。
# 可使用 proxy_groups 的 select / auto / fallback / load_balance 模式。启用系统接管前删除未用占位节点并填写真实参数。
# 运行时按当前平台选择配置，不要一次取消所有可选模式的注释。
# Direct/Block 是规则 action，不是 [[outbounds]] 的 kind。

# ---------- 全部顶层设置（标出的运行数值为默认值；监听与 socket 需按实例配置） ----------
watch_config = false              # true：每秒监测当前文件内容，校验/资源准备成功后热重载；支持原子替换
standalone = false                # true：全部入站流量使用固定出站，无需 Rule Core
# standalone_outbound = "vless-tls" # 仅 standalone=true 时可设置；多节点必填，单节点可省略
# 本文件含多个节点：开启 standalone 时必须同时取消上述选择项的注释。
# 独立模式仅启动 Proxy Core，TCP/UDP 全部使用选定节点；UDP 能力取决于节点协议。
# 无节点、标签不存在或多节点未选择会拒绝启动；上游故障不会回退直连。
# rule_socket 可省略；ipc_connections/decision_timeout_ms/决策缓存不参与独立模式路由。
rule_socket = "/tmp/astra-rule.sock" # 与 example_rule.toml 的 socket 一致；独立模式可省略
socks5_listen = "127.0.0.1:1080"    # TCP CONNECT + UDP ASSOCIATE
http_listen = "127.0.0.1:8080"      # HTTP CONNECT + 普通 HTTP 流式转发
# mixed_listen = "127.0.0.1:7890"   # 同一端口自动识别 SOCKS5 与 HTTP，含 SOCKS5 UDP
authentication = []                # 可填 ["user:password"]，HTTP Basic 与 SOCKS5 用户名/密码认证
lan_allowed_ips = []               # 非空时只允许这些 CIDR，例如 ["127.0.0.0/8", "192.168.1.0/24"]
lan_disallowed_ips = []            # 拒绝优先于允许，例如 ["192.168.1.100/32"]
skip_auth_prefixes = []            # 明确列入的来源 CIDR 可免认证；默认没有例外
# 可只保留一个监听；也可移除两个监听，仅启用 TUN/TPROXY/REDIRECT 中至少一种。
# 所有 TCP 监听地址必须不同，端口非零；IPv6 例：[::1]:1080。系统代理额外要求 SOCKS5 loopback 监听。
ipc_connections = 8               # 1..128；持久 UDS 通道数量
# 单次决策总期限包括排队、连接和重试；规则不可用时缓存未命中新请求失败关闭。
decision_timeout_ms = 500          # >0
connect_timeout_secs = 8           # >0；出站连接/握手期限
shutdown_timeout_secs = 2          # 停止接受连接后等待会话退出的秒数；0 表示不等待
max_connections = 4096            # >0；TCP 会话（含 UDP 控制连接）额度
max_udp_flows = 512                # 1..65536；所有关联共享的 UDP 流额度
udp_targets_per_association = 32   # 1..max_udp_flows；每个关联最大目标数
udp_idle_timeout_secs = 120        # >0；UDP 流/关联空闲回收
# 缓存最多 65536 项；TTL=0 禁用。规则变更推送新版本，缓存按版本隔离；断连后不使用旧版本缓存。
# 版本推送存在短暂异步传播延迟；既有数据流不重新选择出口。
decision_cache_ttl_secs = 5

# ---------- 系统接管参数：启停保存在独立运行目录，通过 TUI S/T 切换；这些表只提供固定参数 ----------
# 可选表默认全部未启用。取消表头注释时，也只取消所需字段的注释。
# 顶层设置必须放在所有 [表] / [[outbounds]] 之前，避免误写入前一张表。

# 系统代理：macOS 网络服务、Linux GNOME 当前用户的 D-Bus、Windows 当前用户 LAN 代理。
# [system_proxy]
# services = ["Wi-Fi"] # macOS 服务名列表；省略/[] 自动发现全部启用服务；Linux 必须省略/[]
# macOS/Linux 使用 socks5_listen；Windows 使用回环 http_listen，支持普通 HTTP 与 HTTPS CONNECT。
# Windows 的 services 必须省略/[]；只接管遵循系统代理的应用，不改变 WinHTTP 或 VPN/RAS 设置。
# 启用前保存 SOCKS 和优先级更高的 HTTP/HTTPS/PAC 等原设置；正常停止/关闭此模式时恢复。
# macOS 需要网络服务写权限；已有需认证的 SOCKS 设置会拒绝接管，避免无法恢复密码。
# 写入前生成 0600 恢复文件；存在未恢复文件时拒绝覆盖，异常退出恢复命令见后文。

# 原生 TUN：Linux/macOS/Windows；Unix 需 root/CAP_NET_ADMIN，Windows 需管理员及官方 Wintun DLL。
# [tun]
# name = "utun20" # macOS；Linux 示例 astra0；省略自动分配；多实例不可重名
# address = "198.18.0.1" # 默认 IPv4 接口地址
# prefix = 30 # 默认 30；0..32
# ipv6_address = "fd00:198:18::1" # 可选；Windows 接管 IPv6 路由时必填
# ipv6_prefix = 126 # 默认 126；0..128
# mtu = 1500 # 默认 1500；1280..9000
# routes = [] # 默认 []：只创建设备，由外部管理路由；列表项必须为 IPv4/IPv6 CIDR
# bypass = [] # 默认 []：经原网关/物理接口绕过的 CIDR；不可覆盖已有冲突路由
# gateway = "192.168.1.1" # 可选：接管前的网关，按真实网络替换
# gateway6 = "fe80::1" # 可选：接管前 IPv6 网关；Windows scope 根据 interface 推断
# interface = "en0" # 接管前物理接口；Linux eth0；Windows Ethernet/中文别名/索引；托管 routes 时必填
# 全局 IPv4 接管变体：将上方 routes/bypass 两行替换为下面两行，不能重复定义同名键：
# routes = ["0.0.0.0/1", "128.0.0.0/1"]
# bypass = ["203.0.113.8/32", "8.8.8.8/32"] # 必须替换为实际节点 IP / 被接管范围内的 DNS
# 非空 bypass 必须配置 gateway 或 interface；公网节点通常需 gateway。
# 先安装 bypass 再安装接管路由；被接管的节点 IP 未被 bypass 覆盖时拒绝运行，防止自环。
# DNS 也应走原出口；局域网 DNS 若已有更具体的物理接口路由，不必再重复添加 bypass。
# 直连规则的 TCP/UDP 绑定 interface；使用域名节点时需维护 DNS 变化后的 bypass。
# 此处 IPv4 routes 不接管 IPv6；IPv6 需对应路由、绕过和网关，不能用 IPv4 网关套用。
# 只提供真实 IP 路由，没有 Fake-IP、域名嗅探或 DNS 劫持；UDP 分片/超 MTU 边界尚未完整验收。
# 节点/规则切换及同设备路由更新保留协议栈；MTU/地址/设备名变更涉及设备重建。
# 修改 MTU 需新设备名；接管路由冲突时先关闭旧 TUN 或由外部管理路由。设备重建可能中断连接。

# Linux TPROXY：CAP_NET_ADMIN/CAP_NET_RAW；TCP/UDP；另需内核支持、透明转发规则及策略路由。
# [tproxy]
# listen = "0.0.0.0:7893" # 必填、端口非零；IPv6 变体 [::]:7893（IPv6-only，需对应 IPv6 规则）
# 不会自动修改防火墙；应排除 Astra 自身出站和保留网段，避免捕获循环。
# 网关 LAN 接管的 nftables、fwmark、ip rule / ip route 及撤销示例见 docs/PROXY_MODES.md。
# 该网关示例不接管本机 OUTPUT；本机接管需另外配置回送及进程排除策略。

# Linux NAT REDIRECT：仅 TCP，通过 SO_ORIGINAL_DST 恢复目标；UDP 使用 TPROXY。
# [redirect]
# listen = "0.0.0.0:7894" # 必填、端口非零；IPv6 变体 [::]:7894
# 需自行配置 NAT PREROUTING 的 TCP redirect 规则；不要将同一批流量同时送入两种透明模式。
# macOS 配置检查拒绝 TPROXY/REDIRECT；使用原生 TUN。详细权限与实测边界见 docs/PROXY_MODES.md。

# ---------- 热切换、热重载与运维示例（以下均为操作命令/环境变量，不是 TOML 字段） ----------
# 自动：将顶层 watch_config 设为 true；无效文件保留旧配置，修正内容后自动重试。
# 信号：kill -HUP <Proxy-Core-PID>，重读当前文件；失败写日志并保留旧配置。
# TUI：Ctrl-S 保存或 c 选择另一配置时热应用；R 手动重载；r 完整重启；e 编辑。
# 候选先校验和准备新增资源，成功后才切换；解析失败、端口占用、权限不足会拒绝候选。
# 已接受的 TCP/SOCKS5 UDP 关联保留原配置，新连接/新关联使用新配置；TUN/TPROXY 新 UDP flow 用新配置。
# TCP/UDP 限额跨配置版本共享；降低额度不强制断开既有流。关闭接管模式/重建设备可能中断对应流。
# 管理 IPC（socket 0600，父目录应仅当前用户可访问）：
# ASTRA_CONTROL_SOCKET=/tmp/astra-proxy-control.sock ./target/release/astra-proxy example_proxy.toml
# ./target/release/astra-proxy --reload /tmp/astra-proxy-control.sock
# ./target/release/astra-proxy --switch /tmp/astra-proxy-control.sock /absolute/path/to/other-proxy.toml
# --switch 成功后记住新路径，之后的 SIGHUP/文件监测针对新文件；相对 CA 路径相对新配置所在目录。
# 每个 core 使用不同 ASTRA_CONTROL_SOCKET；不要给同时启动双 core 的 Python 启动器统一设置同一个值。
# 系统代理异常退出恢复：确认旧 core 停止后执行：
# ./target/release/astra-proxy --restore-system-proxy /absolute/path/to/example_proxy.system-proxy-state.toml
# 无管理 socket 时恢复文件在初始配置旁；有管理 socket 时在 socket 旁，将扩展名替换为 .system-proxy-state.toml。
# 正常恢复会删除文件，失败保留供重试；不要直接删除尚未恢复的文件。
# 日志：ASTRA_LOG_LEVEL=info（trace/debug/info/warn/error）；未设时读 RUST_LOG，两者均未设则默认 info。
# TUI 按 l 打开实时日志；日志页 l 选择显示级别、L 热改 core 记录级别、f 过滤、/ 搜索。
# 上述日志级别是环境变量/运行操作，不存在 log_level TOML 配置字段。
# Mihomo YAML 离线导入（转换不自动接管系统代理/TUN；检查输出与跳过提示后再应用）：
# ./target/release/astra-convert configs/mihomo-example.yaml --check
# ./target/release/astra-convert configs/mihomo-example.yaml -o converted --select Proxy=vless-reality
# 转换输出 converted/proxy.toml 与 converted/rule.toml；已有文件不覆盖，代理组仅固定选择。
# 完整模式操作见 docs/PROXY_MODES.md；转换见 docs/MIHOMO_CONVERTER.md；IPC v2 不可与旧程序混用。

# ---------- 配置语法与协议公共字段 ----------
# [[outbounds]] 是数组；tag 在本文件必须唯一，对应规则 action="proxy:TAG"。
# kind 可取 native / socks5 / http / trojan_tls / vless_tls。
# kind=native 的字段放在 [outbounds.config]：
# protocol/server/port：协议枚举、主机名或裸 IP（IPv6 不加 []）、非零端口。
# uuid：VLESS/VMess/TUIC；password：Trojan/SS/Hysteria2/TUIC。
# cipher：VMess 或 SS；flow：仅 VLESS，空/省略或 xtls-rprx-vision。
# encryption：仅 VLESS，默认 none；支持 mlkem768x25519plus.native/xorpub/random.0rtt/1rtt.KEY。
# cert_pin_sha256：TLS 表内的服务端证书 SHA-256（64 位十六进制），不同于 fingerprint。
# pin 替代 CA 验证，不可与 ca_file/REALITY 合用；TUIC/HY2 不使用此字段。
# mux：仅 VLESS/VMess，smux/yamux/h2mux/muxcool（省略则不复用）。
# obfs_password/pin_sha256：仅 Hysteria2。
# tuic_udp_mode/tuic_idle_timeout_secs/congestion_control：仅 TUIC。
# 不要把不相关字段复制到其他协议；示例按有效组合分别列出。
# TLS/transport 为嵌套表，不存在顶层全局 TLS 或全局 transport。
# [outbounds.config.tls] 全部字段：
# server_name：证书校验名/SNI；ca_file：附加 PEM CA，路径相对本配置文件。
# fingerprint：chrome/chrome120/firefox/firefox120/safari/safari16/ios/android/edge/random；
#              省略使用默认 TLS 后端。TUIC 不支持此字段；HY2 不使用它。
# reality_public_key：服务端 32 字节 X25519 公钥的 base64url（不带 =）。
# reality_short_id：偶数长度十六进制，最多 16 字符；空串表示全零，需要与服务端一致。
# REALITY 仅 TCP/gRPC/XHTTP；不要混用 ca_file 和 REALITY 作为证书验证替代选项。
# [outbounds.config.transport] 全部字段：
# kind=tcp/ws/grpc/http_upgrade/xhttp（默认 tcp）；path 默认 /，必须以 / 开头。
# host 默认 tls.server_name，否则 server；service_name 默认 GunService（仅 gRPC）。
# mode 仅 XHTTP：stream-one（默认）/stream-up/packet-up/auto，当前仅 HTTP/2。
# auto：普通 TLS 选 packet-up，REALITY 选 stream-one；不是轮流尝试模式。
# headers：额外 HTTP 头，最多 64 个；仅 WS/HTTPUpgrade/XHTTP，不能用于 TCP/gRPC。
# 无 TLS 的 VMess/VLESS 传输仅适用于明确需要该配置的服务端/可信链路。

# socks5-plain
[[outbounds]]
kind = "socks5"
tag = "socks5-plain"
server = "127.0.0.1:1081"

# socks5-auth
[[outbounds]]
kind = "socks5"
tag = "socks5-auth"
server = "127.0.0.1:1081"
username = "replace-user"
password = "replace-password"

# http-plain
[[outbounds]]
kind = "http"
tag = "http-plain"
server = "127.0.0.1:1081"

# http-auth
[[outbounds]]
kind = "http"
tag = "http-auth"
server = "127.0.0.1:1081"
username = "replace-user"
password = "replace-password"
# SOCKS5/HTTP 的 server 使用 host:port，IPv6 例 [::1]:1081。
# 认证字段必须同时设置或同时省略；各为非空且最多 255 字节。HTTP 使用 Basic。
# HTTP 上游仅支持 TCP，SOCKS5 上游支持 TCP/UDP。

# ---------- vless-plain-tcp ----------
[[outbounds]]
kind = "native"
tag = "vless-plain-tcp"
[outbounds.config]
protocol = "vless"
server = "node.example.com"
port = 443
uuid = "00000000-0000-0000-0000-000000000001"
[outbounds.config.transport]
kind = "tcp"

# ---------- vless-tls ----------
[[outbounds]]
kind = "native"
tag = "vless-tls"
[outbounds.config]
protocol = "vless"
server = "node.example.com"
port = 443
uuid = "00000000-0000-0000-0000-000000000001"
[outbounds.config.tls]
server_name = "node.example.com"
# ca_file = "certs/private-ca.pem" # 使用自签/私有 CA 时取消注释并提供文件
# fingerprint = "chrome" # 可选；所有支持值见文件顶部
[outbounds.config.transport]
kind = "tcp"

# ---------- vless-tls-ws ----------
[[outbounds]]
kind = "native"
tag = "vless-tls-ws"
[outbounds.config]
protocol = "vless"
server = "node.example.com"
port = 443
uuid = "00000000-0000-0000-0000-000000000001"
[outbounds.config.tls]
server_name = "node.example.com"
# ca_file = "certs/private-ca.pem" # 使用自签/私有 CA 时取消注释并提供文件
# fingerprint = "chrome" # 可选；所有支持值见文件顶部
[outbounds.config.transport]
kind = "ws"
host = "node.example.com"
path = "/astra-path"
[outbounds.config.transport.headers]
"X-Astra-Example" = "replace-or-remove" # 服务端必须允许此头；可删除该 headers 表

